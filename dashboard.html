<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - StudentHub</title>
    <link rel="stylesheet" href="css/style.css?v=11">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="container nav-content">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="#" id="nav-back-btn" onclick="history.back(); return false;" class="back-btn" style="display: none;" title="Go Back"><i class="fas fa-arrow-left"></i></a>
                <a href="index.html" class="logo">
                    <div class="logo-icon"><i class="fas fa-user-graduate"></i></div>
                    StudentHub
                </a>
            </div>
            
            <div class="nav-links">
                <a href="index.html" class="nav-home">Home</a>
                <a href="dashboard.html" class="nav-dash active">Dashboard</a>
                <a href="marketplace.html" class="nav-market">Marketplace</a>
                <a href="list-item.html" class="nav-list logged-in-only">List Item</a>
                <a href="profile.html" class="nav-prof logged-in-only">Profile</a>
                <a href="login.html" id="nav-login-btn" class="btn-login" style="display:none;">Login</a>
                <span id="nav-user-greeting" style="color:var(--text-main); font-weight:bold; margin-right:15px;"></span>
                <a href="#" id="nav-logout-btn" class="btn-login btn-logout" onclick="handleLogout(event)">Logout</a>
                <a href="#" id="theme-toggle" class="btn-login" style="background: var(--primary);"><i class="fas fa-moon"></i></a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 30px; padding-bottom: 60px;">
        <div id="dashboard-content">
            <!-- Loaded dynamically via JavaScript -->
            <div style="text-align:center; padding: 80px 20px;">
                <div style="display: inline-block; width: 50px; height: 50px; border: 4px solid #cbd5e1; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
                <h3 style="margin-top: 15px; color: var(--text-muted);">Loading Student Dashboard...</h3>
            </div>
        </div>
    </div>

    <!-- Printable Receipt Modal -->
    <div id="receiptModal" class="modal">
        <div class="checkout-modal-dialog" style="max-width: 550px;">
            <div class="checkout-header">
                <h3><i class="fas fa-receipt" style="color: var(--primary);"></i> Order Invoice & Receipt</h3>
                <span class="close-modal" onclick="closeReceiptModal()" style="position:static; font-size:1.6rem; cursor:pointer;">&times;</span>
            </div>
            <div class="checkout-body" id="receiptModalBody">
                <!-- Injected by JS -->
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <footer>
        <div class="container">
            <p>© 2026 StudentHub Platform - Official Campus Student Commerce & Trust Network</p>
        </div>
    </footer>

    <!-- Load Checkout Modal JS for any re-buy action -->
    <script src="js/checkout.js?v=10"></script>

    <script>
        let currentUser = null;
        let ordersData = null;
        let activeTab = 'overview';

        async function checkAuth() {
            try {
                const res = await fetch('php/check_auth.php?full=1');
                currentUser = await res.json();
                
                if (!currentUser || !currentUser.loggedIn) {
                    window.location.href = 'login.html';
                    return;
                }

                const greeting = document.getElementById('nav-user-greeting');
                if (greeting && currentUser.name) {
                    greeting.innerHTML = 'Hi, ' + currentUser.name.split(' ')[0] + ' 👋';
                    greeting.style.display = 'inline-block';
                }
                
                // Fetch orders, sales, and statistics
                await loadOrdersData();
                renderDashboard();
            } catch (e) {
                console.error("Auth check failed", e);
                window.location.href = 'login.html';
            }
        }

        async function loadOrdersData() {
            try {
                const res = await fetch('php/get_orders.php');
                ordersData = await res.json();
            } catch (e) {
                console.error("Failed to load orders data", e);
                ordersData = { purchases: [], sales: [], my_products: [], stats: { total_spent: 0, total_earned: 0, purchases_count: 0, sales_count: 0 } };
            }
        }

        function switchTab(tabName) {
            activeTab = tabName;
            document.querySelectorAll('.dash-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-btn-${tabName}`)?.classList.add('active');
            
            document.querySelectorAll('.dash-tab-pane').forEach(pane => pane.style.display = 'none');
            document.getElementById(`tab-pane-${tabName}`).style.display = 'block';

            if (tabName === 'leaderboard') {
                loadLeaderboard();
            }
        }

        function renderDashboard() {
            const stats = (ordersData && ordersData.stats) ? ordersData.stats : { total_spent: 0, total_earned: 0, purchases_count: 0, sales_count: 0, listings_count: 0 };
            const purchases = (ordersData && ordersData.purchases) ? ordersData.purchases : [];
            const sales = (ordersData && ordersData.sales) ? ordersData.sales : [];
            const myProducts = (ordersData && ordersData.my_products) ? ordersData.my_products : [];

            const trustScore = currentUser.trust_score || 85;
            const points = currentUser.points || 0;
            const level = currentUser.level || 1;
            const nextLevelPoints = level * 500;
            const currentLevelPoints = (level - 1) * 500;
            const progress = Math.min(Math.max(((points - currentLevelPoints) / (nextLevelPoints - currentLevelPoints)) * 100, 5), 100);

            const container = document.getElementById('dashboard-content');
            container.innerHTML = `
                <!-- Top Hero Banner -->
                <div class="dash-hero-banner">
                    <div class="dash-user-meta">
                        <img src="${currentUser.profile_image || 'https://picsum.photos/seed/' + currentUser.id + '/150/150'}" class="dash-avatar-lg" alt="${currentUser.name}">
                        <div class="dash-welcome-text">
                            <h1>Welcome back, ${currentUser.name}! 👋</h1>
                            <p>
                                <span><i class="fas fa-graduation-cap"></i> ${currentUser.branch || 'Campus Student'}</span>
                                <span>•</span>
                                <span><i class="fas fa-university"></i> ${currentUser.college_name || 'Campus University'}</span>
                                <span>•</span>
                                <span style="color: #38bdf8; font-weight: 700;"><i class="fas fa-shield-check"></i> Verified Student</span>
                            </p>
                        </div>
                    </div>
                    <div class="dash-hero-actions">
                        <a href="marketplace.html" class="btn-login" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none;">
                            <i class="fas fa-shopping-bag"></i> Browse Store
                        </a>
                        <a href="list-item.html" class="btn-login" style="background: var(--primary); display:inline-flex; align-items:center; gap:8px; text-decoration:none;">
                            <i class="fas fa-plus-circle"></i> Sell Item
                        </a>
                    </div>
                </div>

                <!-- 4 Executive KPI Stat Cards -->
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-icon-wrap kpi-icon-blue">
                            <i class="fas fa-wallet"></i>
                        </div>
                        <div class="kpi-details">
                            <div class="kpi-label">Total Spent</div>
                            <div class="kpi-value">₹${parseFloat(stats.total_spent).toFixed(2)}</div>
                            <div class="kpi-subtext">${stats.purchases_count} items bought on campus</div>
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div class="kpi-icon-wrap kpi-icon-green">
                            <i class="fas fa-hand-holding-usd"></i>
                        </div>
                        <div class="kpi-details">
                            <div class="kpi-label">Sales Earnings</div>
                            <div class="kpi-value">₹${parseFloat(stats.total_earned).toFixed(2)}</div>
                            <div class="kpi-subtext">${stats.sales_count} successful student sales</div>
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div class="kpi-icon-wrap kpi-icon-amber">
                            <i class="fas fa-shield-halved"></i>
                        </div>
                        <div class="kpi-details">
                            <div class="kpi-label">Trust Score</div>
                            <div class="kpi-value" style="color: #f59e0b;">${trustScore}%</div>
                            <div class="kpi-subtext">${currentUser.deals_completed || (stats.purchases_count + stats.sales_count)} Verified Handovers</div>
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div class="kpi-icon-wrap kpi-icon-purple">
                            <i class="fas fa-trophy"></i>
                        </div>
                        <div class="kpi-details">
                            <div class="kpi-label">Student Points</div>
                            <div class="kpi-value" style="color: var(--purple);">${points} Pts</div>
                            <div class="kpi-subtext">Level ${level} Achiever (${Math.round(progress)}% to Lvl ${level + 1})</div>
                        </div>
                    </div>
                </div>

                <!-- Dashboard Nav Tabs -->
                <div class="dash-tabs-nav">
                    <button class="dash-tab-btn ${activeTab === 'overview' ? 'active' : ''}" id="tab-btn-overview" onclick="switchTab('overview')">
                        <i class="fas fa-chart-pie"></i> Overview & Summary
                    </button>
                    <button class="dash-tab-btn ${activeTab === 'orders' ? 'active' : ''}" id="tab-btn-orders" onclick="switchTab('orders')">
                        <i class="fas fa-shopping-cart"></i> My Orders & Purchases (${purchases.length})
                    </button>
                    <button class="dash-tab-btn ${activeTab === 'listings' ? 'active' : ''}" id="tab-btn-listings" onclick="switchTab('listings')">
                        <i class="fas fa-store"></i> My Listed Items & Sales (${myProducts.length})
                    </button>
                    <button class="dash-tab-btn ${activeTab === 'rewards' ? 'active' : ''}" id="tab-btn-rewards" onclick="switchTab('rewards')">
                        <i class="fas fa-medal"></i> Badges & Trust
                    </button>
                    <button class="dash-tab-btn ${activeTab === 'leaderboard' ? 'active' : ''}" id="tab-btn-leaderboard" onclick="switchTab('leaderboard')">
                        <i class="fas fa-crown"></i> Campus Leaderboard
                    </button>
                </div>

                <!-- TAB 1: OVERVIEW -->
                <div class="dash-tab-pane" id="tab-pane-overview" style="display: ${activeTab === 'overview' ? 'block' : 'none'};">
                    <div class="grid-2" style="margin-bottom: 30px;">
                        <!-- Level & Rewards Card -->
                        <div class="form-card" style="margin:0; width:100%; max-width:none;">
                            <h3 style="margin-bottom: 15px; font-size:1.15rem; display:flex; align-items:center; gap:8px;">
                                <i class="fas fa-star" style="color:#fbbf24;"></i> Student Reward Program
                            </h3>
                            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                                <div>
                                    <span style="font-size: 1.8rem; font-weight: 800; color: var(--text-main);">${points}</span>
                                    <span style="color: var(--text-muted); font-size: 0.9rem;">/ ${nextLevelPoints} Points</span>
                                </div>
                                <span class="role-badge" style="position:static; font-size:0.8rem; padding:6px 14px; background:var(--primary); color:white;">
                                    Level ${level} Student
                                </span>
                            </div>
                            <div class="level-bar" style="height: 14px; margin-bottom: 15px;">
                                <div class="level-progress" style="width: ${progress}%;"></div>
                            </div>
                            <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
                                Earn <strong>+50 points</strong> for every purchase and <strong>+100 points</strong> for every item sold to level up and unlock trusted student badges!
                            </p>
                        </div>

                        <!-- Quick Shortcuts Card -->
                        <div class="form-card" style="margin:0; width:100%; max-width:none;">
                            <h3 style="margin-bottom: 15px; font-size:1.15rem; display:flex; align-items:center; gap:8px;">
                                <i class="fas fa-bolt" style="color:var(--primary);"></i> Quick Actions
                            </h3>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                                <a href="marketplace.html" style="padding: 14px; background: #eff6ff; border-radius: 14px; text-decoration: none; color: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 10px; font-size: 0.9rem;">
                                    <i class="fas fa-shopping-bag" style="font-size:1.2rem;"></i> Shop Items
                                </a>
                                <a href="list-item.html" style="padding: 14px; background: #ecfdf5; border-radius: 14px; text-decoration: none; color: #059669; font-weight: 700; display: flex; align-items: center; gap: 10px; font-size: 0.9rem;">
                                    <i class="fas fa-plus-circle" style="font-size:1.2rem;"></i> Post an Ad
                                </a>
                                <a href="chat.html" style="padding: 14px; background: #fdf4ff; border-radius: 14px; text-decoration: none; color: #9333ea; font-weight: 700; display: flex; align-items: center; gap: 10px; font-size: 0.9rem;">
                                    <i class="fas fa-comments" style="font-size:1.2rem;"></i> Messages
                                </a>
                                <a href="profile.html" style="padding: 14px; background: #f8fafc; border-radius: 14px; text-decoration: none; color: var(--text-main); font-weight: 700; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; border:1px solid #e2e8f0;">
                                    <i class="fas fa-id-card" style="font-size:1.2rem;"></i> View Profile
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Orders Section -->
                    <div style="margin-bottom: 30px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
                            <h3 style="font-size: 1.25rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px;">
                                <i class="fas fa-clock-rotate-left" style="color:var(--primary);"></i> Recent Purchases
                            </h3>
                            <button onclick="switchTab('orders')" style="background: transparent; border: none; color: var(--primary); font-weight: 700; cursor: pointer;">
                                View All (${purchases.length}) <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                        ${renderOrdersListHTML(purchases.slice(0, 3))}
                    </div>
                </div>

                <!-- TAB 2: MY ORDERS & PURCHASES -->
                <div class="dash-tab-pane" id="tab-pane-orders" style="display: ${activeTab === 'orders' ? 'block' : 'none'};">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <div>
                            <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-main);">My Orders & Purchases</h2>
                            <p style="color: var(--text-muted); font-size: 0.88rem;">Track items you've bought, view payment receipts, and delivery coordinates.</p>
                        </div>
                        <a href="marketplace.html" class="connect-btn" style="margin: 0; width: auto; padding: 10px 20px; background: var(--primary); text-decoration: none; font-size: 0.88rem;">
                            <i class="fas fa-plus"></i> Buy More Items
                        </a>
                    </div>
                    ${renderOrdersListHTML(purchases)}
                </div>

                <!-- TAB 3: MY LISTED ITEMS & SALES -->
                <div class="dash-tab-pane" id="tab-pane-listings" style="display: ${activeTab === 'listings' ? 'block' : 'none'};">
                    <!-- My Products Section -->
                    <div style="margin-bottom: 35px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <div>
                                <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-main);">My Store Listings</h2>
                                <p style="color: var(--text-muted); font-size: 0.88rem;">All items you've put up for sale on the campus marketplace.</p>
                            </div>
                            <a href="list-item.html" class="connect-btn" style="margin: 0; width: auto; padding: 10px 20px; background: var(--primary); text-decoration: none; font-size: 0.88rem;">
                                <i class="fas fa-plus-circle"></i> List New Item
                            </a>
                        </div>
                        ${renderMyListingsHTML(myProducts)}
                    </div>

                    <!-- Items Sold to Others -->
                    <div style="margin-bottom: 30px;">
                        <h2 style="font-size: 1.3rem; font-weight: 800; color: var(--text-main); margin-bottom: 15px;">
                            <i class="fas fa-handshake" style="color:var(--success);"></i> Sales & Handover Log
                        </h2>
                        ${renderSalesListHTML(sales)}
                    </div>
                </div>

                <!-- TAB 4: REWARDS & TRUST -->
                <div class="dash-tab-pane" id="tab-pane-rewards" style="display: ${activeTab === 'rewards' ? 'block' : 'none'};">
                    <div class="grid-2" style="margin-bottom: 30px;">
                        <div class="form-card" style="margin: 0; width: 100%; max-width: none;">
                            <h3 style="margin-bottom: 20px;"><i class="fas fa-shield-halved" style="color: #10b981;"></i> Campus Trust Score</h3>
                            <div style="text-align: center; margin-bottom: 20px;">
                                <div style="font-size: 4.5rem; font-weight: 800; color: #10b981;">${trustScore}%</div>
                                <p style="color: var(--text-muted); font-weight: 700;">Verified Campus Community Member</p>
                            </div>
                            <div style="display: flex; justify-content: space-around; background: var(--bg); padding: 15px; border-radius: 14px;">
                                <div style="text-align:center;">
                                    <div style="font-size: 1.4rem; font-weight: 800; color: var(--text-main);">${stats.purchases_count + stats.sales_count}</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted);">Total Deals</div>
                                </div>
                                <div style="text-align:center;">
                                    <div style="font-size: 1.4rem; font-weight: 800; color: #10b981;">100%</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted);">Success Rate</div>
                                </div>
                                <div style="text-align:center;">
                                    <div style="font-size: 1.4rem; font-weight: 800; color: var(--primary);">&lt; 2 hrs</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted);">Response Avg</div>
                                </div>
                            </div>
                        </div>

                        <div class="form-card" style="margin: 0; width: 100%; max-width: none;">
                            <h3 style="margin-bottom: 20px;"><i class="fas fa-medal" style="color: #f59e0b;"></i> Student Badges</h3>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
                                <span class="role-badge" style="position:static; font-size:0.8rem; padding:8px 14px; background:#eff6ff; color:var(--primary);"><i class="fas fa-check-double"></i> Verified Student</span>
                                <span class="role-badge" style="position:static; font-size:0.8rem; padding:8px 14px; background:#ecfdf5; color:#059669;"><i class="fas fa-shield-alt"></i> Safe Trader</span>
                                <span class="role-badge" style="position:static; font-size:0.8rem; padding:8px 14px; background:#fffbeb; color:#d97706;"><i class="fas fa-bolt"></i> Fast Payer</span>
                                <span class="role-badge" style="position:static; font-size:0.8rem; padding:8px 14px; background:#f5f3ff; color:#7c3aed;"><i class="fas fa-trophy"></i> Early Pioneer</span>
                            </div>
                            <h4 style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">Ways to unlock higher prestige:</h4>
                            <p style="font-size: 0.82rem; color: var(--text-muted); line-height: 1.6;">
                                • Complete 5 campus sales to earn <strong>Master Seller</strong>.<br>
                                • Keep 90%+ trust rating to earn <strong>Elite Peer</strong> badge.<br>
                                • Verify university ID card for the blue verification checkmark.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- TAB 5: LEADERBOARD -->
                <div class="dash-tab-pane" id="tab-pane-leaderboard" style="display: ${activeTab === 'leaderboard' ? 'block' : 'none'};">
                    <div style="margin-bottom: 20px;">
                        <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-main);"><i class="fas fa-crown" style="color:#fbbf24;"></i> Campus Commerce Leaderboard</h2>
                        <p style="color: var(--text-muted); font-size: 0.88rem;">Top students actively trading, sharing notes, and keeping campus commerce honest.</p>
                    </div>
                    <div id="leaderboard-container">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            `;
        }

        // Render Orders List
        function renderOrdersListHTML(orders) {
            if (!orders || orders.length === 0) {
                return `
                    <div class="empty-state-box">
                        <i class="fas fa-shopping-bag empty-state-icon"></i>
                        <h3>No Orders Yet</h3>
                        <p>You haven't purchased any items on the campus marketplace yet. Check out available textbooks, notes, and gadgets!</p>
                        <a href="marketplace.html" class="connect-btn" style="display: inline-flex; width: auto; margin: 0 auto; background: var(--primary); text-decoration: none;">
                            <i class="fas fa-shopping-bag"></i> Browse Marketplace
                        </a>
                    </div>
                `;
            }

            return `
                <div class="orders-list-grid">
                    ${orders.map(o => {
                        const statusClass = (o.payment_status === 'paid' || o.status === 'completed') ? 'status-paid' : 'status-pending';
                        const statusText = (o.payment_status === 'paid' || o.status === 'completed') ? 'Paid & Confirmed' : 'Payment Pending';
                        const method = (o.payment_method || 'UPI').toUpperCase();
                        const orderJson = JSON.stringify(o).replace(/"/g, '&quot;');

                        return `
                            <div class="order-row-card" id="order-card-${o.id}">
                                <img src="${o.product_image || 'https://picsum.photos/seed/' + o.product_id + '/120/120'}" class="order-prod-thumb" alt="${o.product_title}">
                                <div class="order-main-info">
                                    <div class="order-header-line">
                                        <span class="order-title">${o.product_title || 'Campus Item'}</span>
                                        <span class="order-ref-badge">${o.transaction_ref || 'TXN-' + o.id}</span>
                                        <span class="role-badge" style="position:static; padding:2px 8px; font-size:0.68rem;">${o.product_category || 'General'}</span>
                                    </div>
                                    <div class="order-sub-meta">
                                        <span><i class="fas fa-user-circle"></i> Seller: <strong>${o.seller_name || 'Student'}</strong></span>
                                        <span><i class="fas fa-calendar-alt"></i> ${o.created_at || 'Recently'}</span>
                                        <span><i class="fas fa-map-marker-alt"></i> ${o.delivery_address || 'Campus Meetup'}</span>
                                    </div>
                                </div>
                                <div class="order-price-status">
                                    <div class="order-amount">₹${parseFloat(o.amount).toFixed(2)}</div>
                                    <span class="status-pill ${statusClass}">
                                        <i class="fas fa-check-circle"></i> ${statusText}
                                    </span>
                                    <div style="font-size: 0.72rem; color: var(--text-muted); font-weight:700; margin-top:3px;">
                                        Via ${method}
                                    </div>
                                    <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
                                        <button onclick="viewReceipt(${orderJson})" style="padding: 6px 11px; background: transparent; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.73rem; font-weight: 700; color: var(--primary); cursor: pointer; display:flex; align-items:center; gap:4px;">
                                            <i class="fas fa-receipt"></i> Receipt
                                        </button>
                                        <button onclick="deleteOrder(${o.id})" style="padding: 6px 11px; background: #fef2f2; border: 1.5px solid #fecaca; border-radius: 8px; font-size: 0.73rem; font-weight: 700; color: #dc2626; cursor: pointer; display:flex; align-items:center; gap:4px;">
                                            <i class="fas fa-trash-alt"></i> Delete
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // Render My Listings
        function renderMyListingsHTML(products) {
            if (!products || products.length === 0) {
                return `
                    <div class="empty-state-box">
                        <i class="fas fa-box-open empty-state-icon"></i>
                        <h3>No Items Listed</h3>
                        <p>You haven't listed any items for sale yet. Post your textbooks, calculators, electronics, or notes!</p>
                        <a href="list-item.html" class="connect-btn" style="display: inline-flex; width: auto; margin: 0 auto; background: var(--primary); text-decoration: none;">
                            <i class="fas fa-plus"></i> List an Item Now
                        </a>
                    </div>
                `;
            }

            return `
                <div class="orders-list-grid">
                    ${products.map(p => {
                        const isSold = p.status === 'sold';
                        return `
                            <div class="order-row-card" id="listing-card-${p.id}">
                                <img src="${p.image_url || 'https://picsum.photos/seed/prod' + p.id + '/120/120'}" class="order-prod-thumb" alt="${p.title}">
                                <div class="order-main-info">
                                    <div class="order-header-line">
                                        <span class="order-title">${p.title}</span>
                                        <span class="role-badge" style="position:static; padding:2px 8px; font-size:0.68rem;">${p.category}</span>
                                    </div>
                                    <div class="order-sub-meta">
                                        <span><i class="fas fa-eye"></i> ${p.views || 0} Views</span>
                                        <span><i class="fas fa-calendar-alt"></i> Listed on ${p.created_at || 'Recently'}</span>
                                        ${isSold ? `<span style="color:var(--success); font-weight:700;"><i class="fas fa-user-check"></i> Sold to: ${p.buyer_name || 'Campus Student'}</span>` : ''}
                                    </div>
                                </div>
                                <div class="order-price-status">
                                    <div class="order-amount">₹${parseFloat(p.price).toFixed(2)}</div>
                                    ${isSold ? 
                                        '<span class="status-pill status-paid"><i class="fas fa-check-circle"></i> SOLD</span>' : 
                                        '<span class="status-pill status-completed"><i class="fas fa-bolt"></i> ACTIVE FOR SALE</span>'
                                    }
                                    <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
                                        ${!isSold ? `
                                        <a href="list-item.html?edit=${p.id}" style="padding: 6px 11px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; font-size: 0.73rem; font-weight: 700; color: var(--primary); cursor: pointer; text-decoration:none; display:flex; align-items:center; gap:4px;">
                                            <i class="fas fa-edit"></i> Edit
                                        </a>` : ''}
                                        <button onclick="deleteListing(${p.id})" style="padding: 6px 11px; background: #fef2f2; border: 1.5px solid #fecaca; border-radius: 8px; font-size: 0.73rem; font-weight: 700; color: #dc2626; cursor: pointer; display:flex; align-items:center; gap:4px;">
                                            <i class="fas fa-trash-alt"></i> Delete
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // Render Sales Log
        function renderSalesListHTML(sales) {
            if (!sales || sales.length === 0) {
                return `
                    <div style="background: var(--card-bg); padding: 25px; border-radius: 18px; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                        No sales recorded yet. Once another student buys your listed item, it will show up here!
                    </div>
                `;
            }

            return `
                <div class="orders-list-grid">
                    ${sales.map(s => `
                        <div class="order-row-card" style="border-left: 4px solid var(--success);">
                            <img src="${s.product_image || 'https://picsum.photos/seed/' + s.product_id + '/120/120'}" class="order-prod-thumb" alt="${s.product_title}">
                            <div class="order-main-info">
                                <div class="order-header-line">
                                    <span class="order-title">${s.product_title}</span>
                                    <span class="order-ref-badge">${s.transaction_ref || 'TXN-' + s.id}</span>
                                </div>
                                <div class="order-sub-meta">
                                    <span><i class="fas fa-user"></i> Buyer: <strong>${s.buyer_name || 'Student'}</strong> (${s.phone || 'Phone on file'})</span>
                                    <span><i class="fas fa-map-marker-alt"></i> Meetup: <strong>${s.delivery_address || 'Campus'}</strong></span>
                                </div>
                            </div>
                            <div class="order-price-status">
                                <div class="order-amount" style="color: var(--success);">+₹${parseFloat(s.amount).toFixed(2)}</div>
                                <span class="status-pill status-paid"><i class="fas fa-check"></i> ${s.payment_method?.toUpperCase()}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Receipt Modal
        function viewReceipt(o) {
            const body = document.getElementById('receiptModalBody');
            body.innerHTML = `
                <div class="receipt-box" id="printable-order-receipt" style="margin-top:0;">
                    <div style="text-align: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 14px;">
                        <div style="font-weight: 800; font-size: 1.25rem; color: var(--primary);">StudentHub Platform</div>
                        <div style="font-size: 0.78rem; color: var(--text-muted);">Official Campus Order Invoice & Proof of Purchase</div>
                    </div>

                    <div class="receipt-row">
                        <span class="receipt-label">Order Ref:</span>
                        <span class="receipt-val" style="font-family:monospace; color:var(--primary);">${o.transaction_ref || 'TXN-' + o.id}</span>
                    </div>
                    <div class="receipt-row">
                        <span class="receipt-label">Item Title:</span>
                        <span class="receipt-val">${o.product_title || 'Campus Item'}</span>
                    </div>
                    <div class="receipt-row">
                        <span class="receipt-label">Seller:</span>
                        <span class="receipt-val">${o.seller_name || 'Student Seller'}</span>
                    </div>
                    <div class="receipt-row">
                        <span class="receipt-label">Amount:</span>
                        <span class="receipt-val" style="font-size:1.15rem; color:var(--success);">₹${parseFloat(o.amount).toFixed(2)}</span>
                    </div>
                    <div class="receipt-row">
                        <span class="receipt-label">Payment Method:</span>
                        <span class="receipt-val" style="text-transform:uppercase;">${o.payment_method || 'UPI'}</span>
                    </div>
                    <div class="receipt-row">
                        <span class="receipt-label">Status:</span>
                        <span class="receipt-val" style="color:var(--success); text-transform:uppercase;">${o.payment_status || 'PAID'}</span>
                    </div>
                    <div class="receipt-row">
                        <span class="receipt-label">Delivery Spot:</span>
                        <span class="receipt-val">${o.delivery_address || 'Campus Meetup'}</span>
                    </div>
                    <div class="receipt-row">
                        <span class="receipt-label">Date:</span>
                        <span class="receipt-val">${o.created_at || 'Recently'}</span>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 20px;">
                    <button type="button" onclick="printOrderInvoice()" class="connect-btn" style="flex:1; margin:0; background:var(--primary); padding:12px;">
                        <i class="fas fa-print"></i> Print Invoice
                    </button>
                    <button type="button" onclick="closeReceiptModal()" style="flex:1; padding:12px; border-radius:14px; border:1px solid #cbd5e1; background:transparent; font-weight:700; color:var(--text-muted); cursor:pointer;">
                        Close
                    </button>
                </div>
            `;
            document.getElementById('receiptModal').style.display = 'flex';
        }

        function closeReceiptModal() {
            document.getElementById('receiptModal').style.display = 'none';
        }

        function printOrderInvoice() {
            const el = document.getElementById('printable-order-receipt');
            if (!el) return;
            const w = window.open('', '', 'width=600,height=600');
            w.document.write(`
                <html>
                    <head><title>StudentHub Receipt</title></head>
                    <body style="font-family:'Segoe UI',Arial,sans-serif; padding:30px; color:#1e293b;">
                        ${el.outerHTML}
                        <script>window.print(); setTimeout(() => window.close(), 500);<\/script>
                    </body>
                </html>
            `);
            w.document.close();
        }

        // ─── DELETE ORDER (My Purchases) ───
        async function deleteOrder(orderId) {
            if (!confirm('Kya aap sach mein is order ko delete karna chahte hain?\n\nYe order ki history hata di jayegi.')) return;

            const card = document.getElementById('order-card-' + orderId);
            if (card) {
                card.style.opacity = '0.5';
                card.style.pointerEvents = 'none';
            }

            try {
                const res = await fetch('php/delete_order.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderId })
                });
                const data = await res.json();

                if (data.success) {
                    showToast('✅ Order delete ho gaya!', 'success');
                    if (card) card.remove();
                } else {
                    showToast('❌ Error: ' + (data.error || 'Delete nahi ho saka'), 'error');
                    if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
                }
            } catch (e) {
                showToast('❌ Server error. Dobara try karein.', 'error');
                if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
            }
        }

        // ─── DELETE LISTING (My Store Items) ───
        async function deleteListing(productId) {
            if (!confirm('Kya aap apni yeh listing marketplace se hata dena chahte hain?')) return;

            const card = document.getElementById('listing-card-' + productId);
            if (card) {
                card.style.opacity = '0.5';
                card.style.pointerEvents = 'none';
            }

            try {
                const res = await fetch('php/delete_product.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: productId })
                });
                const data = await res.json();

                if (data.success) {
                    showToast('✅ Item marketplace se hata diya gaya!', 'success');
                    if (card) card.remove();
                } else {
                    showToast('❌ Error: ' + (data.error || 'Delete nahi ho saka'), 'error');
                    if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
                }
            } catch (e) {
                showToast('❌ Server error. Dobara try karein.', 'error');
                if (card) { card.style.opacity = '1'; card.style.pointerEvents = 'auto'; }
            }
        }

        // ─── TOAST NOTIFICATION ───
        function showToast(message, type) {
            const old = document.getElementById('dash-toast');
            if (old) old.remove();

            const toast = document.createElement('div');
            toast.id = 'dash-toast';
            toast.style.cssText = `
                position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
                background: ${type === 'success' ? '#10b981' : '#ef4444'};
                color: white; padding: 14px 28px; border-radius: 50px;
                font-weight: 700; font-size: 0.95rem;
                box-shadow: 0 8px 30px rgba(0,0,0,0.2);
                z-index: 999999; animation: slideUpToast 0.3s ease;
                display: flex; align-items: center; gap: 10px;
            `;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Leaderboard loader
        async function loadLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            if (!container) return;
            container.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:30px;">Loading campus rankings...</p>';

            try {
                const res = await fetch('php/leaderboard.php');
                const leaders = await res.json();

                if (!leaders || leaders.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">No rankings available yet.</p>';
                    return;
                }

                container.innerHTML = leaders.map((user, index) => {
                    const rankClass = index === 0 ? 'gold' : index === 1 ? 'silver' : index === 2 ? 'bronze' : 'default';
                    const isCurrentUser = currentUser && currentUser.id === user.id;

                    return `
                        <div class="leaderboard-item ${isCurrentUser ? 'is-current-user' : ''}">
                            <div class="leaderboard-rank ${rankClass}">${index + 1}</div>
                            <img src="${user.profile_image || 'https://picsum.photos/seed/' + user.id + '/100/100'}" class="leaderboard-avatar">
                            <div class="leaderboard-info">
                                <div class="leaderboard-name">
                                    ${user.name} ${isCurrentUser ? '<span class="badge-tag" style="margin-left: 10px; font-size:0.75rem;"><i class="fas fa-user"></i> You</span>' : ''}
                                </div>
                                <div class="leaderboard-stats">
                                    ${user.branch || 'Student'} • Level ${user.level || 1}
                                </div>
                            </div>
                            <div class="leaderboard-points">
                                <i class="fas fa-coins" style="color:#fbbf24;"></i> ${user.points || 0} Pts
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("Error loading leaderboard", e);
                container.innerHTML = '<p style="color:red; text-align:center;">Failed to load leaderboard.</p>';
            }
        }

        function handleLogout(e) {
            e.preventDefault();
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.top = '20px';
            toast.style.right = '20px';
            toast.style.background = '#10b981';
            toast.style.color = 'white';
            toast.style.padding = '15px 25px';
            toast.style.borderRadius = '8px';
            toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
            toast.style.zIndex = '9999';
            toast.style.fontWeight = 'bold';
            toast.innerHTML = '<i class="fas fa-check-circle"></i> Logged out securely. See you soon!';
            document.body.appendChild(toast);
            
            setTimeout(() => {
                window.location.href = 'php/logout.php';
            }, 1200);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname.split('/').pop() || 'dashboard.html';
            document.querySelectorAll('.nav-links a').forEach(link => {
                if (link.getAttribute('href') === currentPath) link.classList.add('active');
            });

            const themeToggleBtn = document.getElementById('theme-toggle');
            const body = document.body;
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark-mode');
                if (themeToggleBtn) themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
            }

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    body.classList.toggle('dark-mode');
                    if (body.classList.contains('dark-mode')) {
                        localStorage.setItem('theme', 'dark');
                        themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
                    } else {
                        localStorage.setItem('theme', 'light');
                        themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
                    }
                });
            }
        });

        window.onload = checkAuth;
    </script>
</body>
</html>
