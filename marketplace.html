<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - StudentHub</title>
    <link rel="stylesheet" href="css/style.css?v=11">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
 <nav>
        <div class="container nav-content">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="#" id="nav-back-btn" onclick="history.back(); return false;" class="back-btn" style="display: none;" title="Go Back"><i class="fas fa-arrow-left"></i></a>
                <a href="index.html" class="logo">
                    <div class="logo-icon"><i class="fas fa-user-graduate"></i></div>
                    StudentHub
                </a>
            </div>
            
            <div class="nav-links">
                <a href="index.html" class="nav-home">Home</a>
                <a href="dashboard.html" class="nav-dash logged-in-only" style="display:none;">Dashboard</a>
                <a href="marketplace.html" class="nav-market">Marketplace</a>
                <a href="list-item.html" class="nav-list logged-in-only" style="display:none;">List Item</a>
                <a href="profile.html" class="nav-prof logged-in-only" style="display:none;">Profile</a>
                <a href="login.html" id="nav-login-btn" class="btn-login" style="display:none;">Login</a>
                <span id="nav-user-greeting" style="display:none; color:var(--text-main); font-weight:bold; margin-right:15px;"></span>
                <a href="#" id="nav-logout-btn" class="btn-login btn-logout" style="display:none;" onclick="handleLogout(event)">Logout</a>
                <a href="#" id="theme-toggle" class="btn-login" style="background: var(--primary);"><i class="fas fa-moon"></i></a>
            </div>
        </div>
    </nav>

    <div class="container">
        <header class="page-header">
            <h1><i class="fas fa-store"></i> Student Marketplace</h1>
            <p>Buy books, tech gadgets, notes & projects directly from campus peers with real secure payments.</p>
            
            <!-- Clean Search and Sort Controls -->
            <div style="max-width: 800px; margin: 25px auto 0; display: flex; gap: 14px; flex-wrap: wrap;">
                <div class="search-container" style="flex: 1; min-width: 280px; position: relative;">
                    <input type="text" id="search-input" placeholder="Search by item name, category, or seller..." style="width: 100%; padding: 15px 45px 15px 22px; border-radius: 30px; border: 2px solid var(--primary); font-size: 1rem; outline: none; background: var(--card-bg); color: var(--text-main); box-shadow: 0 4px 15px rgba(0,0,0,0.06);">
                    <i class="fas fa-search" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--primary); font-size: 1.1rem;"></i>
                </div>
                <select id="sort-select" onchange="applyFilters()" style="padding: 12px 22px; border-radius: 30px; border: 2px solid #cbd5e1; background: var(--card-bg); color: var(--text-main); font-weight: 700; outline: none; cursor: pointer;">
                    <option value="newest">Sort: Newest First</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                </select>
                <a href="list-item.html" class="connect-btn" style="margin: 0; width: auto; padding: 12px 24px; border-radius: 30px; background: var(--primary); text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                    <i class="fas fa-plus-circle"></i> Sell Item
                </a>
            </div>
        </header>

        <div id="products-grid" class="user-grid">
            <!-- Product cards loaded dynamically -->
        </div>
    </div>

    <!-- Official Razorpay Checkout Gateway SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Load Checkout Modal JS -->
    <script src="js/checkout.js?v=10"></script>

    <script>
        let allProducts = [];

        async function loadProducts() {
            try {
                const res = await fetch('php/get_products.php');
                const products = await res.json();
                
                if (products.error) {
                    console.error("Database Error:", products.error);
                    const grid = document.getElementById('products-grid');
                    grid.innerHTML = `<p style="text-align: center; color: red;">Error loading products: ${products.error}</p>`;
                    return;
                }
                
                allProducts = products || [];
                applyFilters();
            } catch (e) {
                console.error("Error loading products:", e);
            }
        }

        function applyFilters() {
            const query = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
            const sortVal = document.getElementById('sort-select')?.value || 'newest';

            let filtered = allProducts.filter(p => {
                if (!query) return true;
                const title = (p.title || '').toLowerCase();
                const category = (p.category || '').toLowerCase();
                const seller = (p.seller_name || '').toLowerCase();
                return title.includes(query) || category.includes(query) || seller.includes(query);
            });

            // Sorting
            if (sortVal === 'price_asc') {
                filtered.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
            } else if (sortVal === 'price_desc') {
                filtered.sort((a, b) => parseFloat(b.price) - parseFloat(a.price));
            } else {
                filtered.sort((a, b) => parseInt(b.id) - parseInt(a.id));
            }

            renderProducts(filtered);
        }

        function renderProducts(productsToRender) {
            const grid = document.getElementById('products-grid');
            if (!productsToRender || productsToRender.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1;" class="empty-state-box">
                        <i class="fas fa-box-open empty-state-icon"></i>
                        <h3>No Products Found</h3>
                        <p>No products match your current search or category filter. Try clearing filters or list your own item!</p>
                        <a href="list-item.html" class="connect-btn" style="display: inline-flex; width: auto; margin: 0 auto; background: var(--primary);">
                            <i class="fas fa-plus"></i> List an Item Now
                        </a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = productsToRender.map(product => {
                const isSold = product.status === 'sold';
                const sellerTrust = product.seller_trust ? parseInt(product.seller_trust) : 80;
                const safeTitle = (product.title || '').replace(/'/g, "\\'");
                const safeSeller = (product.seller_name || 'Student').replace(/'/g, "\\'");
                const safeCategory = (product.category || 'General').replace(/'/g, "\\'");
                const safeImg = (product.image_url || `https://picsum.photos/seed/prod${product.id}/400/300`).replace(/'/g, "\\'");

                return `
                    <div class="user-card-wrapper" style="${isSold ? 'opacity: 0.8;' : ''}">
                        <div class="user-card">
                            <div class="user-image-box">
                                <img src="${product.image_url || 'https://picsum.photos/seed/prod' + product.id + '/400/300'}" alt="${product.title}">
                                <span class="role-badge">${product.category || 'General'}</span>
                                ${isSold ? 
                                    '<span style="position:absolute; bottom:15px; left:15px; background: #ef4444; color:white; font-size:0.75rem; font-weight:800; padding:4px 10px; border-radius:12px; text-transform:uppercase;"><i class="fas fa-check-circle"></i> SOLD OUT</span>' : 
                                    '<span style="position:absolute; bottom:15px; left:15px; background: rgba(16,185,129,0.9); color:white; font-size:0.75rem; font-weight:800; padding:4px 10px; border-radius:12px; backdrop-filter:blur(4px);"><i class="fas fa-bolt"></i> IN STOCK</span>'
                                }
                            </div>
                            <div class="user-details">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                                    <h3 style="margin: 0; font-size: 1.15rem; line-height: 1.3;">${product.title}</h3>
                                    <span style="font-weight: 800; color: var(--primary); font-size: 1.25rem; white-space: nowrap; margin-left: 10px;">₹${parseFloat(product.price).toFixed(2)}</span>
                                </div>

                                <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px; background: var(--bg); padding: 6px 10px; border-radius: 8px;">
                                    <span><i class="fas fa-user-circle"></i> ${product.seller_name || 'Student'}</span>
                                    <span style="color: #10b981; font-weight: 700;"><i class="fas fa-shield-alt"></i> ${sellerTrust}% Trust</span>
                                </div>

                                ${isSold ? `
                                    <button disabled class="connect-btn" style="background: #94a3b8; cursor: not-allowed; opacity: 0.8;">
                                        <i class="fas fa-ban"></i> Sold Out
                                    </button>
                                ` : `
                                    <button onclick="handleBuyClick(${product.id}, '${safeTitle}', ${product.price}, '${safeImg}', '${safeSeller}', '${safeCategory}')" class="connect-btn" style="background: var(--primary);">
                                        <i class="fas fa-shopping-bag"></i> Buy Now
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleBuyClick(id, title, price, img, seller, category) {
            openCheckout(id, title, price, img, seller, category);
        }

        document.getElementById('search-input')?.addEventListener('input', applyFilters);

        window.onload = loadProducts;
    </script>
    <script>
        function handleLogout(e) {
            e.preventDefault();
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.top = '20px';
            toast.style.right = '20px';
            toast.style.background = '#10b981';
            toast.style.color = 'white';
            toast.style.padding = '15px 25px';
            toast.style.borderRadius = '8px';
            toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
            toast.style.zIndex = '9999';
            toast.style.fontWeight = 'bold';
            toast.innerHTML = '<i class="fas fa-check-circle"></i> See you soon! You\'ve been securely logged out.';
            toast.style.display = 'flex';
            toast.style.alignItems = 'center';
            toast.style.gap = '10px';
            document.body.appendChild(toast);
            
            setTimeout(() => {
                window.location.href = 'php/logout.php';
            }, 1500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-links a').forEach(link => {
                if (link.getAttribute('href') === currentPath) link.classList.add('active');
            });

            const backBtn = document.getElementById('nav-back-btn');
            if (backBtn && currentPath !== 'index.html' && currentPath !== '') {
                backBtn.style.display = 'flex';
            }

            const themeToggleBtn = document.getElementById('theme-toggle');
            const body = document.body;
            
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark-mode');
                if(themeToggleBtn) themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
            }

            if(themeToggleBtn) {
                themeToggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    body.classList.toggle('dark-mode');
                    if (body.classList.contains('dark-mode')) {
                        localStorage.setItem('theme', 'dark');
                        themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
                    } else {
                        localStorage.setItem('theme', 'light');
                        themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
                    }
                });
            }
        });

        (async function checkNavAuth() {
            try {
                const res = await fetch('php/check_auth.php');
                const auth = await res.json();
                
                const loginBtn = document.getElementById('nav-login-btn');
                const logoutBtn = document.getElementById('nav-logout-btn');
                const greeting = document.getElementById('nav-user-greeting');
                const privateLinks = document.querySelectorAll('.logged-in-only');
                
                if (auth.loggedIn) {
                    if (loginBtn) loginBtn.style.display = 'none';
                    if (logoutBtn) logoutBtn.style.display = 'inline-block';
                    if (greeting) {
                        greeting.innerHTML = 'Hi, ' + (auth.user_name ? auth.user_name.split(' ')[0] : 'User') + ' 👋';
                        greeting.style.display = 'inline-block';
                    }
                    privateLinks.forEach(link => link.style.display = 'inline-block');
                } else {
                    if (loginBtn) loginBtn.style.display = 'inline-block';
                    if (logoutBtn) logoutBtn.style.display = 'none';
                    if (greeting) greeting.style.display = 'none';
                    privateLinks.forEach(link => link.style.display = 'none');
                }
            } catch(e) { }
        })();
    </script>
</body>
</html>
