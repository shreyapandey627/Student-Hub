<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - StudentHub</title>
    <link rel="stylesheet" href="css/style.css?v=11">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }

        .profile-hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            padding: 60px 0 80px;
            position: relative;
            overflow: hidden;
        }
        .profile-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 50%, rgba(99,102,241,0.15) 0%, transparent 70%),
                        radial-gradient(ellipse at 70% 30%, rgba(16,185,129,0.10) 0%, transparent 60%);
        }
        .profile-hero-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 36px;
            flex-wrap: wrap;
        }
        .avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .avatar-wrap img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(99,102,241,0.6);
            box-shadow: 0 0 40px rgba(99,102,241,0.3);
        }
        .online-dot {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 18px;
            height: 18px;
            background: #10b981;
            border-radius: 50%;
            border: 3px solid #0f172a;
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
            50%      { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
        }
        .hero-info h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            margin: 0 0 8px;
        }
        .hero-info .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 16px;
        }
        .hero-info .subtitle span {
            color: #6366f1;
            font-weight: 600;
        }
        .hero-badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .badge-chip {
            background: rgba(99,102,241,0.15);
            border: 1px solid rgba(99,102,241,0.3);
            color: #a5b4fc;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
        }

        .profile-body {
            max-width: 900px;
            margin: -40px auto 60px;
            padding: 0 24px;
            position: relative;
            z-index: 2;
        }

        /* Action Card */
        .action-card {
            background: #fff;
            border-radius: 20px;
            padding: 28px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.1);
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .action-card .left h3 { margin: 0 0 4px; font-size: 1.1rem; color: #0f172a; }
        .action-card .left p  { margin: 0; color: #64748b; font-size: 0.9rem; }
        .chat-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(99,102,241,0.35);
        }
        .chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99,102,241,0.5);
        }
        .chat-btn i { font-size: 1.1rem; }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        @media(max-width:600px){ .info-grid { grid-template-columns: 1fr; } }

        .info-card {
            background: #fff;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
            transition: transform 0.2s;
        }
        .info-card:hover { transform: translateY(-3px); }
        .info-card h4 {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6366f1;
            margin: 0 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-card p {
            color: #334155;
            font-size: 0.95rem;
            line-height: 1.7;
            margin: 0;
        }

        .stat-strip {
            background: #fff;
            border-radius: 18px;
            padding: 20px 28px;
            display: flex;
            gap: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
            margin-bottom: 24px;
        }
        .stat-item {
            flex: 1;
            text-align: center;
            position: relative;
        }
        .stat-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0; top: 10%; bottom: 10%;
            width: 1px;
            background: #e2e8f0;
        }
        .stat-item .num {
            font-size: 1.8rem;
            font-weight: 800;
            color: #6366f1;
        }
        .stat-item .lbl {
            font-size: 0.82rem;
            color: #94a3b8;
            font-weight: 500;
            margin-top: 2px;
        }

        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 10px;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        #not-found {
            text-align: center;
            padding: 80px 20px;
            display: none;
        }
        #not-found .icon { font-size: 4rem; color: #e2e8f0; margin-bottom: 16px; }
        #not-found h2 { color: #64748b; }
    </style>
</head>
<body>
    
    
    
    
    
    
    
    <nav>
        <div class="container nav-content">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="#" id="nav-back-btn" onclick="history.back(); return false;" class="back-btn" style="display: none;" title="Go Back"><i class="fas fa-arrow-left"></i></a>
                <a href="index.html" class="logo">
                    <div class="logo-icon"><i class="fas fa-user-graduate"></i></div>
                    StudentHub
                </a>
            </div>
            
            <div class="nav-links">
                <a href="index.html" class="nav-home">Home</a>
                <a href="dashboard.html" class="nav-dash logged-in-only" style="display:none;">Dashboard</a>
                <a href="marketplace.html" class="nav-market">Marketplace</a>
                <a href="list-item.html" class="nav-list logged-in-only" style="display:none;">List Item</a>
                <a href="profile.html" class="nav-prof logged-in-only" style="display:none;">Profile</a>
                <a href="login.html" id="nav-login-btn" class="btn-login" style="display:none;">Login</a>
                <span id="nav-user-greeting" style="display:none; color:var(--text-main); font-weight:bold; margin-right:15px;"></span>
                <a href="#" id="nav-logout-btn" class="btn-login btn-logout" style="display:none;" onclick="handleLogout(event)">Logout</a>
                <a href="#" id="theme-toggle" class="btn-login" style="background: var(--primary);"><i class="fas fa-moon"></i></a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <div class="profile-hero" id="hero">
        <div class="profile-hero-inner">
            <div class="avatar-wrap">
                <div class="skeleton" id="avatar-sk" style="width:140px;height:140px;border-radius:50%;"></div>
                <img id="avatar-img" src="" alt="Profile" style="display:none;">
                <div class="online-dot" id="online-dot" style="display:none;"></div>
            </div>
            <div class="hero-info" id="hero-info">
                <div class="skeleton" style="width:220px;height:36px;margin-bottom:12px;"></div>
                <div class="skeleton" style="width:160px;height:20px;margin-bottom:16px;"></div>
                <div class="skeleton" style="width:100px;height:28px;border-radius:20px;"></div>
            </div>
        </div>
    </div>

    <!-- Body -->
    <div class="profile-body">
        <div id="not-found">
            <div class="icon"><i class="fas fa-user-slash"></i></div>
            <h2>User not found</h2>
            <p style="color:#94a3b8;">This profile does not exist or has been removed.</p>
            <a href="index.html" class="chat-btn" style="display:inline-flex;margin-top:20px;">Go Home</a>
        </div>

        <div id="profile-body-content">
            <!-- Action card -->
            <div class="action-card">
                <div class="left">
                    <h3 id="action-name"><div class="skeleton" style="width:180px;height:22px;"></div></h3>
                    <p id="action-sub"><div class="skeleton" style="width:240px;height:16px;margin-top:6px;"></div></p>
                </div>
                <div id="chat-action-wrap">
                    <!-- filled by JS after auth check -->
                </div>
            </div>

            <!-- Stats -->
            <div class="stat-strip" id="stat-strip">
                <div class="stat-item">
                    <div class="num" id="stat-year">-</div>
                    <div class="lbl">Study Year</div>
                </div>
                <div class="stat-item">
                    <div class="num" id="stat-since">-</div>
                    <div class="lbl">Joined</div>
                </div>
                <div class="stat-item">
                    <div class="num" id="stat-listings">-</div>
                    <div class="lbl">Listings</div>
                </div>
            </div>

            <!-- Info Grid -->
            <div class="info-grid" id="info-grid">
                <div class="info-card">
                    <h4><i class="fas fa-user-circle"></i> About</h4>
                    <p id="card-about" class="skeleton" style="height:60px;">&nbsp;</p>
                </div>
                <div class="info-card">
                    <h4><i class="fas fa-brain"></i> Knowledge</h4>
                    <p id="card-knowledge" class="skeleton" style="height:60px;">&nbsp;</p>
                </div>
                <div class="info-card">
                    <h4><i class="fas fa-briefcase"></i> Experience</h4>
                    <p id="card-exp" class="skeleton" style="height:60px;">&nbsp;</p>
                </div>
                <div class="info-card">
                    <h4><i class="fas fa-code"></i> Projects</h4>
                    <p id="card-projects" class="skeleton" style="height:60px;">&nbsp;</p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <footer>
        <div class="container">
            <p>© 2026 StudentHub Platform - Trust-Based Campus Marketplace</p>
        </div>
    </footer>
    <script>
        function handleLogout(e) {
            e.preventDefault();
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.top = '20px';
            toast.style.right = '20px';
            toast.style.background = '#10b981';
            toast.style.color = 'white';
            toast.style.padding = '15px 25px';
            toast.style.borderRadius = '8px';
            toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
            toast.style.zIndex = '9999';
            toast.style.fontWeight = 'bold';
            toast.innerHTML = '<i class="fas fa-check-circle"></i> See you soon! You\'ve been securely logged out.';
            toast.style.display = 'flex';
            toast.style.alignItems = 'center';
            toast.style.gap = '10px';
            document.body.appendChild(toast);
            
            setTimeout(() => {
                window.location.href = 'php/logout.php';
            }, 1500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-links a').forEach(link => {
                if (link.getAttribute('href') === currentPath) link.classList.add('active');
            });

            const backBtn = document.getElementById('nav-back-btn');
            if (backBtn && currentPath !== 'index.html' && currentPath !== '') {
                backBtn.style.display = 'flex';
            }

            const themeToggleBtn = document.getElementById('theme-toggle');
            const body = document.body;
            
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark-mode');
                if(themeToggleBtn) themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
            }

            if(themeToggleBtn) {
                themeToggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    body.classList.toggle('dark-mode');
                    if (body.classList.contains('dark-mode')) {
                        localStorage.setItem('theme', 'dark');
                        themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
                    } else {
                        localStorage.setItem('theme', 'light');
                        themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
                    }
                });
            }
        });

        (async function checkNavAuth() {
            try {
                const res = await fetch('php/check_auth.php');
                const auth = await res.json();
                
                const loginBtn = document.getElementById('nav-login-btn');
                const logoutBtn = document.getElementById('nav-logout-btn');
                const greeting = document.getElementById('nav-user-greeting');
                const privateLinks = document.querySelectorAll('.logged-in-only');
                
                if (auth.loggedIn) {
                    if (loginBtn) loginBtn.style.display = 'none';
                    if (logoutBtn) logoutBtn.style.display = 'inline-block';
                    if (greeting) {
                        greeting.innerHTML = 'Hi, ' + (auth.user_name ? auth.user_name.split(' ')[0] : 'User') + ' 👋';
                        greeting.style.display = 'inline-block';
                    }
                    privateLinks.forEach(link => link.style.display = 'inline-block');
                } else {
                    if (loginBtn) loginBtn.style.display = 'inline-block';
                    if (logoutBtn) logoutBtn.style.display = 'none';
                    if (greeting) greeting.style.display = 'none';
                    privateLinks.forEach(link => link.style.display = 'none');
                }
                
                // Fetch profile data
                fetchUserProfile(auth);
            } catch(e) { 
                fetchUserProfile({loggedIn: false});
            }
        })();

        async function fetchUserProfile(auth) {
            const params = new URLSearchParams(window.location.search);
            const userId = params.get('id');
            if (!userId) {
                document.getElementById('profile-body-content').style.display = 'none';
                document.getElementById('hero-info').style.display = 'none';
                document.getElementById('not-found').style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`php/get_user_profile.php?id=${userId}`);
                const user = await res.json();

                if (user.error) {
                    document.getElementById('profile-body-content').style.display = 'none';
                    document.getElementById('hero-info').style.display = 'none';
                    document.getElementById('not-found').style.display = 'block';
                    return;
                }

                // Update Hero Info
                document.getElementById('avatar-sk').style.display = 'none';
                const avatarImg = document.getElementById('avatar-img');
                avatarImg.src = user.profile_image || `https://picsum.photos/seed/${user.id}/140/140`;
                avatarImg.style.display = 'block';
                document.getElementById('online-dot').style.display = 'block';

                const badgesHtml = user.badges ? user.badges.map(b => `<span class="badge-chip"><i class="fas fa-medal"></i> ${b}</span>`).join('') : '';

                document.getElementById('hero-info').innerHTML = `
                    <h1>${user.name}</h1>
                    <div class="subtitle">
                        <i class="fas fa-graduation-cap"></i> ${user.branch || 'Student'} 
                        ${user.year ? `· <span>Year ${user.year}</span>` : ''}
                    </div>
                    <div class="hero-badges">${badgesHtml}</div>
                `;

                // Update Action Card
                document.getElementById('action-name').textContent = user.name;
                document.getElementById('action-sub').textContent = user.role === 'admin' ? 'Platform Admin' : 'Verified Student';

                // Handle Chat Button
                const chatWrap = document.getElementById('chat-action-wrap');
                if (auth.loggedIn) {
                    if (parseInt(auth.user_id) === parseInt(user.id)) {
                        chatWrap.innerHTML = `<span style="color:#64748b; font-weight:600;"><i class="fas fa-user"></i> This is you</span>`;
                    } else {
                        chatWrap.innerHTML = `<a href="chat.html?with=${user.id}" class="chat-btn"><i class="fas fa-comment-dots"></i> Message</a>`;
                    }
                } else {
                    chatWrap.innerHTML = `<a href="login.html" class="chat-btn" style="background:#475569;"><i class="fas fa-sign-in-alt"></i> Login to Message</a>`;
                }

                // Update Stats
                document.getElementById('stat-year').textContent = user.year || '-';
                document.getElementById('stat-since').textContent = user.join_year || new Date().getFullYear();
                document.getElementById('stat-listings').textContent = user.product_count || '0';

                // Update Info Cards
                const updateCard = (id, text, defaultText) => {
                    const el = document.getElementById(id);
                    el.className = ''; // remove skeleton
                    el.style.height = 'auto';
                    el.textContent = text || defaultText;
                };

                updateCard('card-about', user.description, "No bio provided.");
                updateCard('card-knowledge', user.knowledge, "No knowledge areas listed.");
                updateCard('card-exp', user.experience, "No experience listed.");
                
                const projects = [user.minor_project, user.major_project].filter(Boolean).join('<br><br>');
                const projEl = document.getElementById('card-projects');
                projEl.className = '';
                projEl.style.height = 'auto';
                projEl.innerHTML = projects || "No projects listed.";

            } catch(e) {
                console.error("Failed to fetch user profile", e);
                document.getElementById('profile-body-content').style.display = 'none';
                document.getElementById('hero-info').style.display = 'none';
                document.getElementById('not-found').style.display = 'block';
            }
        }
    </script>
</body>
</html>
