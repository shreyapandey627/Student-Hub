<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - StudentHub</title>
    <link rel="stylesheet" href="css/style.css?v=11">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    
    
    
    
    
    
    
    <nav>
        <div class="container nav-content">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="#" id="nav-back-btn" onclick="history.back(); return false;" class="back-btn" style="display: none;" title="Go Back"><i class="fas fa-arrow-left"></i></a>
                <a href="index.html" class="logo">
                    <div class="logo-icon"><i class="fas fa-user-graduate"></i></div>
                    StudentHub
                </a>
            </div>
            
            <div class="nav-links">
                <a href="index.html" class="nav-home">Home</a>
                <a href="dashboard.html" class="nav-dash logged-in-only" style="display:none;">Dashboard</a>
                <a href="marketplace.html" class="nav-market">Marketplace</a>
                <a href="list-item.html" class="nav-list logged-in-only" style="display:none;">List Item</a>
                <a href="profile.html" class="nav-prof logged-in-only" style="display:none;">Profile</a>
                <a href="login.html" id="nav-login-btn" class="btn-login" style="display:none;">Login</a>
                <span id="nav-user-greeting" style="display:none; color:var(--text-main); font-weight:bold; margin-right:15px;"></span>
                <a href="#" id="nav-logout-btn" class="btn-login btn-logout" style="display:none;" onclick="handleLogout(event)">Logout</a>
                <a href="#" id="theme-toggle" class="btn-login" style="background: var(--primary);"><i class="fas fa-moon"></i></a>
            </div>
        </div>
    </nav>

    <div class="container">
        <header class="page-header">
            <h1><i class="fas fa-user-circle"></i> My Profile</h1>
            <p>Manage your campus profile and verification</p>
        </header>

        <div id="profile-content"></div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <footer>
        <div class="container">
            <p>© 2026 StudentHub Platform - Trust-Based Campus Marketplace</p>
        </div>
    </footer>

    <script>
        let currentUser = null;

        async function checkAuth() {
            try {
                const res = await fetch('php/check_auth.php?full=1');
                currentUser = await res.json();
                
                if (!currentUser || !currentUser.loggedIn) {
                    window.location.href = 'login.html';
                    return;
                }
                
                renderProfile();
            } catch (e) {
                console.error("Auth check failed", e);
                window.location.href = 'login.html';
            }
        }

        function renderProfile() {
            const trustClass = currentUser.trust_score >= 70 ? '' : 
                              (currentUser.trust_score >= 40 ? 'warning' : 'critical');
            const verificationText = currentUser.verification_level === 'full' ? 'Fully Verified' :
                                     currentUser.verification_level === 'id' ? 'ID Verified' :
                                     currentUser.verification_level === 'email' ? 'Email Verified' : 'Not Verified';
            
            // Update page header
            document.querySelector('.page-header h1').innerHTML = `<i class="fas fa-user-circle"></i> ${currentUser.name}'s Profile`;

            document.getElementById('profile-content').innerHTML = `
                <div class="form-card" style="max-width: 800px;">
                    <div style="display: flex; align-items: center; gap: 30px; margin-bottom: 30px; flex-wrap: wrap;">
                        <div style="position: relative;">
                            <img src="${currentUser.profile_image || 'https://picsum.photos/seed/' + currentUser.id + '/150/150'}" 
                                 style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary);">
                            ${currentUser.is_verified ? '<span class="trust-badge" style="position: absolute; bottom: 0; right: 0;"><i class="fas fa-check"></i></span>' : ''}
                        </div>
                        <div>
                            <h2 style="font-size: 2rem; margin-bottom: 5px;">${currentUser.name}</h2>
                            <p style="color: var(--primary); font-weight: 600;">
                                <i class="fas fa-graduation-cap"></i> ${currentUser.branch} - Year ${currentUser.year}
                            </p>
                            <div class="badges-display" style="margin-top: 10px;">
                                ${currentUser.badges && currentUser.badges.length > 0 ? 
                                    currentUser.badges.map(b => `<span class="badge-tag"><i class="fas fa-medal"></i> ${b}</span>`).join('') : 
                                    '<span style="color: var(--text-muted);">No badges yet</span>'
                                }
                            </div>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px;">
                        <div style="text-align: center; padding: 20px; background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%); border-radius: 16px;">
                            <div style="font-size: 2.5rem; font-weight: 800; color: #065f46;">
                                ${currentUser.trust_score || 50}%
                            </div>
                            <div style="color: #065f46; font-weight: 600;">Trust Score</div>
                        </div>
                        <div style="text-align: center; padding: 20px; background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border-radius: 16px;">
                            <div style="font-size: 2.5rem; font-weight: 800; color: #92400e;">
                                ${currentUser.points || 0}
                            </div>
                            <div style="color: #92400e; font-weight: 600;">Points</div>
                        </div>
                        <div style="text-align: center; padding: 20px; background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%); border-radius: 16px;">
                            <div style="font-size: 2.5rem; font-weight: 800; color: #4338ca;">
                                ${currentUser.deals_completed || 0}
                            </div>
                            <div style="color: #4338ca; font-weight: 600;">Deals Done</div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h4>Verification Status</h4>
                        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                            <div style="display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: ${currentUser.verification_level !== 'none' ? '#d1fae5' : '#f1f5f9'}; border-radius: 12px;">
                                <i class="fas fa-envelope" style="color: ${currentUser.verification_level !== 'none' ? '#065f46' : '#94a3b8'};"></i>
                                <span style="color: ${currentUser.verification_level !== 'none' ? '#065f46' : '#94a3b8'};">Email Verified</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: ${currentUser.verification_level === 'id' || currentUser.verification_level === 'full' ? '#d1fae5' : '#f1f5f9'}; border-radius: 12px;">
                                <i class="fas fa-id-card" style="color: ${currentUser.verification_level === 'id' || currentUser.verification_level === 'full' ? '#065f46' : '#94a3b8'};"></i>
                                <span style="color: ${currentUser.verification_level === 'id' || currentUser.verification_level === 'full' ? '#065f46' : '#94a3b8'};">ID Verified</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: ${currentUser.verification_level === 'full' ? '#d1fae5' : '#f1f5f9'}; border-radius: 12px;">
                                <i class="fas fa-shield-halved" style="color: ${currentUser.verification_level === 'full' ? '#065f46' : '#94a3b8'};"></i>
                                <span style="color: ${currentUser.verification_level === 'full' ? '#065f46' : '#94a3b8'};">Full Verified</span>
                            </div>
                        </div>
                        <p style="margin-top: 15px; color: var(--text-muted); font-size: 0.9rem;">
                            ${currentUser.verification_level === 'full' ? 
                                'Your account is fully verified. Buyers will trust you more!' :
                              currentUser.verification_level === 'id' ?
                                'Upload additional documents to get full verification.' :
                              currentUser.verification_level === 'email' ?
                                'Verify your student ID to increase trust score by 5 points.' :
                                'Complete verification to build trust with buyers.'
                            }
                        </p>
                    </div>

                    <div class="detail-section">
                        <h4>Trust Breakdown</h4>
                        <div style="margin-top: 15px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span>Deals Success Rate</span>
                                <span style="font-weight: 600;">${currentUser.deals_completed > 0 ? Math.round((currentUser.successful_deals / currentUser.deals_completed) * 100) : 0}%</span>
                            </div>
                            <div style="height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;">
                                <div style="height: 100%; width: ${currentUser.deals_completed > 0 ? (currentUser.successful_deals / currentUser.deals_completed) * 100 : 0}%; background: var(--success);"></div>
                            </div>
                        </div>
                        <div style="margin-top: 15px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span>Verification Level</span>
                                <span style="font-weight: 600;">${verificationText}</span>
                            </div>
                            <div style="height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;">
                                <div style="height: 100%; width: ${currentUser.verification_level === 'full' ? 100 : currentUser.verification_level === 'id' ? 66 : currentUser.verification_level === 'email' ? 33 : 0}%; background: var(--primary);"></div>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                        <a href="edit_profile.html" class="connect-btn" style="flex: 1; text-decoration: none; background: #3b82f6;">
                            <i class="fas fa-user-edit"></i> Edit Profile
                        </a>
                        <a href="dashboard.html" class="connect-btn" style="flex: 1; text-decoration: none;">
                            <i class="fas fa-chart-line"></i> View Dashboard
                        </a>
                        <a href="marketplace.html" class="connect-btn btn-secondary" style="flex: 1; text-decoration: none;">
                            <i class="fas fa-store"></i> Browse Marketplace
                        </a>
                    </div>

                    <div style="margin-top: 20px; padding-top: 20px; border-top: 2px dashed #fecaca;">
                        <h4 style="color: #dc2626; margin-bottom: 8px; font-size: 0.95rem;">
                            <i class="fas fa-exclamation-triangle"></i> Danger Zone
                        </h4>
                        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px;">
                            Once you delete your account, all your data, listings, and history will be permanently removed. This action cannot be undone.
                        </p>
                        <button onclick="confirmDeleteAccount()" style="background: #dc2626; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; gap: 8px;">
                            <i class="fas fa-trash-alt"></i> Delete My Account Permanently
                        </button>
                    </div>
                </div>
            `;
        }

        window.onload = checkAuth;

        async function confirmDeleteAccount() {
            const confirmed = confirm("⚠️ Are you sure you want to DELETE your account?\n\nThis will permanently remove:\n- Your profile\n- All your listings\n- All your orders & history\n- All your points & badges\n\nThis action CANNOT be undone!");
            if (!confirmed) return;

            const doubleConfirm = confirm("🔴 FINAL WARNING!\n\nAre you absolutely sure? Type OK to confirm permanent deletion.");
            if (!doubleConfirm) return;

            try {
                const res = await fetch('php/delete_account.php', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    alert("✅ Your account has been deleted. Goodbye!");
                    window.location.href = 'index.html';
                } else {
                    alert("❌ Error: " + (data.error || "Could not delete account."));
                }
            } catch (e) {
                alert("❌ Server error. Please try again.");
            }
        }
    </script>
    <script>
        function handleLogout(e) {
            e.preventDefault();
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.top = '20px';
            toast.style.right = '20px';
            toast.style.background = '#10b981';
            toast.style.color = 'white';
            toast.style.padding = '15px 25px';
            toast.style.borderRadius = '8px';
            toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
            toast.style.zIndex = '9999';
            toast.style.fontWeight = 'bold';
            toast.innerHTML = '<i class="fas fa-check-circle"></i> See you soon! You\'ve been securely logged out.';
            toast.style.display = 'flex';
            toast.style.alignItems = 'center';
            toast.style.gap = '10px';
            document.body.appendChild(toast);
            
            setTimeout(() => {
                window.location.href = 'php/logout.php';
            }, 1500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-links a').forEach(link => {
                if (link.getAttribute('href') === currentPath) link.classList.add('active');
            });

            const backBtn = document.getElementById('nav-back-btn');
            if (backBtn && currentPath !== 'index.html' && currentPath !== '') {
                backBtn.style.display = 'flex';
            }

            const themeToggleBtn = document.getElementById('theme-toggle');
            const body = document.body;
            
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark-mode');
                if(themeToggleBtn) themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
            }

            if(themeToggleBtn) {
                themeToggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    body.classList.toggle('dark-mode');
                    if (body.classList.contains('dark-mode')) {
                        localStorage.setItem('theme', 'dark');
                        themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
                    } else {
                        localStorage.setItem('theme', 'light');
                        themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
                    }
                });
            }
        });

        (async function checkNavAuth() {
            try {
                const res = await fetch('php/check_auth.php');
                const auth = await res.json();
                
                const loginBtn = document.getElementById('nav-login-btn');
                const logoutBtn = document.getElementById('nav-logout-btn');
                const greeting = document.getElementById('nav-user-greeting');
                const privateLinks = document.querySelectorAll('.logged-in-only');
                
                if (auth.loggedIn) {
                    if (loginBtn) loginBtn.style.display = 'none';
                    if (logoutBtn) logoutBtn.style.display = 'inline-block';
                    if (greeting) {
                        greeting.innerHTML = 'Hi, ' + (auth.user_name ? auth.user_name.split(' ')[0] : 'User') + ' 👋';
                        greeting.style.display = 'inline-block';
                    }
                    privateLinks.forEach(link => link.style.display = 'inline-block');
                } else {
                    if (loginBtn) loginBtn.style.display = 'inline-block';
                    if (logoutBtn) logoutBtn.style.display = 'none';
                    if (greeting) greeting.style.display = 'none';
                    privateLinks.forEach(link => link.style.display = 'none');
                }
            } catch(e) { }
        })();
    </script>
</body>
</html>
